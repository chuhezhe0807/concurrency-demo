# nginx 作为微服务统一入口：监听 80，反向代理到 Spring Cloud Gateway(gateway-service:8090)。
# gateway 再按 Nacos 注册的 serviceId 把请求路由到 product-service / order-service。

# events 块：配置 nginx 的事件驱动模型（连接处理方式）。
# 这里留空表示全部使用默认值（如 worker_connections 默认 512/1024），但该块本身必填，不能省略。
events {}

# http 块：所有 HTTP/反向代理相关配置都写在这里。
http {
    # resolver 指定 DNS 服务器：127.0.0.11 是 docker 内置 DNS，用于把容器名(gateway-service)解析成容器 IP。
    # valid=10s 表示解析结果只缓存 10 秒，过期后重新解析，避免 gateway 容器重启换 IP 后 nginx 仍用旧 IP 导致请求失败。
    resolver 127.0.0.11 valid=10s;

    # upstream 定义一组后端服务器，命名为 gateway_upstream，供下面 proxy_pass 引用。
    upstream gateway_upstream {
        # 后端目标：容器名 gateway-service 的 8090 端口（Spring Cloud Gateway 监听端口）。
        server gateway-service:8090;
    }

    # server 块：定义一个虚拟主机（一个监听端口 + 一套路由规则）。
    server {
        # 监听 80 端口（HTTP 默认端口），对外暴露的统一入口。
        listen 80;
        # server_name _ 是通配/兜底名，匹配任意未被其他 server 显式匹配的 Host，作为默认 server。
        server_name _;

        # location / 匹配所有以 / 开头的请求，即把全部流量都交给下面的代理处理。
        location / {
            # 把请求反向代理到上面定义的 gateway_upstream（即 gateway-service:8090）。
            proxy_pass http://gateway_upstream;
            # 透传原始 Host 头，让网关/后端能拿到客户端请求的真实域名。
            proxy_set_header Host              $host;
            # 透传客户端真实 IP（直连 nginx 的那一跳）。
            proxy_set_header X-Real-IP         $remote_addr;
            # 追加客户端 IP 到 X-Forwarded-For 链，记录请求经过的代理链路。
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # 透传原始协议(http/https)，便于后端判断请求是否来自 HTTPS。
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebFlux 网关支持长连接/SSE，关闭缓冲并升级连接
            # 使用 HTTP/1.1 与后端通信（默认是 1.0），HTTP/1.1 才支持 keep-alive 长连接。
            proxy_http_version 1.1;
            # 清空 Connection 头（默认会被设为 close），配合 HTTP/1.1 复用到后端的长连接。
            proxy_set_header Connection "";
            # 关闭响应缓冲：nginx 不攒够数据再转发，而是边收边发，保证 SSE/流式响应实时性。
            proxy_buffering off;
        }
    }
}
