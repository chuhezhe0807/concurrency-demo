server:
  port: 8072   # 订单微服务端口（monolith 8080 / gateway 8090 / product 8071 互不冲突）

spring:
  application:
    name: order-service   # 注册到 Nacos 的服务名，网关按此 serviceId 路由
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    # 独立连接 MySQL（t_order 表）。库存归 product-service 管，订单服务不直接读写商品表。
    url: jdbc:mysql://localhost:3306/concurrency_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: demo
    password: demo123
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Seata 分布式事务（US-021，AT 模式）。
# order-service 是全局事务发起方(TM)：placeOrder 上 @GlobalTransactional 开启全局事务，
# 拿到 XID 后经 Feign 透传给 product-service，两边的本地事务作为分支由 TC 统一提交/回滚。
seata:
  enabled: true
  application-id: order-service
  tx-service-group: default_tx_group          # 事务分组名（逻辑名）
  service:
    vgroup-mapping:
      default_tx_group: default                # 分组 -> 集群名，须与 TC 集群名一致(默认 default)
    grouplist:
      default: 127.0.0.1:8091                  # file 模式直连 TC（服务跑在宿主机，seata 容器映射到 8091）
  registry:
    type: file                                 # 不经 Nacos，直连 grouplist
  config:
    type: file
  data-source-proxy-mode: AT                   # 自动代理数据源，业务 SQL 旁路生成 undo_log

management:
  endpoints:
    web:
      exposure:
        include: health,info
