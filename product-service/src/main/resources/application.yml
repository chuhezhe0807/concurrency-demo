server:
  port: 8071   # 商品微服务端口（monolith 8080 / gateway 8090 互不冲突）

spring:
  application:
    name: product-service   # 注册到 Nacos 的服务名，网关按此 serviceId 路由
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    # 独立连接 MySQL（与单体同一实例同库 concurrency_demo，微服务各自持有自己的数据源）
    url: jdbc:mysql://localhost:3306/concurrency_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: demo
    password: demo123
    driver-class-name: com.mysql.cj.jdbc.Driver
  # RabbitMQ 可靠消息（US-022）。消费扣库存消息，手动 ack 保证处理成功才确认。
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual   # 手动 ack：扣库存+回传成功才确认，处理中崩溃则消息重投不丢

  mail:
    host: smtp.163.com         # SMTP 服务器地址，如 smtp.qq.com / smtp.163.com
    port: 465                      # 163 用 465(SSL)；不支持 587(STARTTLS)，否则握手即断 bad greeting
    username: xxx@163.com    # 发件人账号
    password: JVQkdHnRkHj2vEgk   # 授权码（不是登录密码）
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true           # 465 端口走 SSL；连上即 SSL 握手，无需 STARTTLS
            required: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Seata 分布式事务（US-021，AT 模式）。
# product-service 是分支参与方(RM)：收到 order-service 经 Feign 透传的 XID 后，扣库存 SQL 注册为分支事务，
# 旁路生成 undo_log，全局回滚时据此还原库存。tx-service-group/grouplist 须与 order-service 完全一致。
seata:
  enabled: true
  application-id: product-service
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: 127.0.0.1:8091 # Seata TC 服务端口
  registry:
    type: file
  config:
    type: file
  data-source-proxy-mode: AT


# 扣库存消费演示开关：true 时消费扣库存消息直接抛异常 → 进死信队列 → 触发邮件告警。
# 演示 DLQ 告警链路用，验证完改回 false 即恢复正常扣库存。
stock:
  mock-fail: false

# DLQ 告警配置（US-023）。消息进入死信队列时发送邮件告警。
dlq:
  alert:
    enabled: false                  # 告警开关，测试环境可设 false 关闭
    from: xxx@163.com       # 发件人（与 spring.mail.username 保持一致）
    to:                            # 收件人列表（支持多个）
      - zzz@163.com
    subject-prefix: "[告警][product-service] 死信队列有消息"  # 邮件标题前缀
    # 冷却时间（秒）：同一 orderNo 在此窗口内只发一封告警，防止频繁重复告警
    cooldown-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info
