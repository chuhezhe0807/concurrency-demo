# 高并发演示项目第三方依赖
# 启动：docker-compose up -d
# 停止：docker-compose down        （加 -v 连数据卷一起删除）
#
# 服务与连接信息：
#   MySQL    8.0  -> localhost:3306  库 concurrency_demo  用户 demo/demo123  (root 密码 root123)
#   Redis    7    -> localhost:6379  无密码
#   RabbitMQ 3.13 -> localhost:5672  (AMQP)  guest/guest
#                    localhost:15672 (管理界面 http://localhost:15672)
#   Nacos    2.3.2-> localhost:8848  (控制台/HTTP, http://localhost:8848/nacos  nacos/nacos)
#                    localhost:9848  (gRPC，Nacos 2.x 客户端长连接必需)
#   Seata    2.1.0-> localhost:8091  (TC 事务协调器 Netty 端口，客户端直连)
#                    localhost:7091  (控制台 http://localhost:7091  seata/seata)
#
# 注意：rabbitmq 仅在 MQ 阶段(US-015)使用；nacos 在微服务阶段(US-017 起)使用；seata 在 US-021(强一致)使用。
#       若 docker.io 拉取受限，可先只启动数据库与缓存：docker-compose up -d mysql redis

services:
  mysql:
    image: mysql:8.0
    container_name: concurrency-demo-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: concurrency_demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo123
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化时自动执行建表与造数脚本
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: concurrency-demo-redis
    ports:
      # 宿主机 6379 可能被其他项目占用，这里映射到 6380（容器内仍是 6379）
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: concurrency-demo-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: concurrency-demo-nacos
    environment:
      MODE: standalone          # 单机模式，内置 Derby，无需外部数据库
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "8848:8848"             # 控制台 + 客户端 HTTP（注册/发现/配置）
      - "9848:9848"             # Nacos 2.x 客户端 gRPC 长连接（必需，否则注册超时）
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Seata Server（TC 事务协调器，US-021 分布式事务强一致）。
  # STORE_MODE=file：全局/分支会话存内存+本地文件，无需外部库（demo 够用，重启丢未决事务）。
  # 注册/配置用 file 模式：客户端经 application.yml 的 grouplist 直连 127.0.0.1:8091，不依赖 Nacos。
  # 业务库需有 undo_log 表（AT 模式回滚日志），见 docker/mysql/init/01-schema-and-seed.sql。
  seata:
    image: apache/seata-server:2.1.0
    container_name: concurrency-demo-seata
    ports:
      - "8091:8091"             # TC Netty 端口，客户端 RM/TM 直连
      - "7091:7091"             # 控制台（seata/seata）
    environment:
      STORE_MODE: file
      SEATA_PORT: 8091
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://localhost:7091 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
