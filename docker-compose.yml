# 高并发演示项目：第三方依赖 + 阶段二微服务整体部署
# 仅起基础设施：     docker-compose up -d mysql redis rabbitmq nacos seata
# 构建并整体部署：   docker-compose up -d --build   （含 product/order/gateway/nginx）
# 停止：             docker-compose down            （加 -v 连数据卷一起删除）
#
# 统一入口：http://localhost/      （nginx:80 -> gateway-service:8090 -> 下游微服务）
# 网关直连：http://localhost:8090/ （调试用）
#
# 服务与连接信息：
#   MySQL    8.0  -> localhost:3306  库 concurrency_demo  用户 demo/demo123  (root 密码 root123)
#   Redis    7    -> localhost:6379  无密码
#   RabbitMQ 3.13 -> localhost:5672  (AMQP)  guest/guest
#                    localhost:15672 (管理界面 http://localhost:15672)
#   Nacos    2.3.2-> localhost:8848  (控制台/HTTP, http://localhost:8848/nacos  nacos/nacos)
#                    localhost:9848  (gRPC，Nacos 2.x 客户端长连接必需)
#   Seata    2.1.0-> localhost:8091  (TC 事务协调器 Netty 端口，客户端直连)
#                    localhost:7091  (控制台 http://localhost:7091  seata/seata)
#
# 注意：rabbitmq 仅在 MQ 阶段(US-015)使用；nacos 在微服务阶段(US-017 起)使用；seata 在 US-021(强一致)使用。
#       若 docker.io 拉取受限，可先只启动数据库与缓存：docker-compose up -d mysql redis

services:
  mysql:
    image: mysql:8.0
    container_name: concurrency-demo-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: concurrency_demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo123
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化时自动执行建表与造数脚本
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: concurrency-demo-redis
    ports:
      # 宿主机 6379 可能被其他项目占用，这里映射到 6380（容器内仍是 6379）
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: concurrency-demo-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: concurrency-demo-nacos
    environment:
      MODE: standalone          # 单机模式，内置 Derby，无需外部数据库
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "8848:8848"             # 控制台 + 客户端 HTTP（注册/发现/配置）
      - "9848:9848"             # Nacos 2.x 客户端 gRPC 长连接（必需，否则注册超时）
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Seata Server（TC 事务协调器，US-021 分布式事务强一致）。
  # STORE_MODE=file：全局/分支会话存内存+本地文件，无需外部库（demo 够用，重启丢未决事务）。
  # 注册/配置用 file 模式：客户端经 application.yml 的 grouplist 直连 127.0.0.1:8091，不依赖 Nacos。
  # 业务库需有 undo_log 表（AT 模式回滚日志），见 docker/mysql/init/01-schema-and-seed.sql。
  seata:
    image: apache/seata-server:2.1.0
    container_name: concurrency-demo-seata
    ports:
      - "8091:8091"             # TC Netty 端口，客户端 RM/TM 直连
      - "7091:7091"             # 控制台（seata/seata）
    environment:
      STORE_MODE: file
      SEATA_PORT: 8091
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://localhost:7091 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===== 应用微服务（阶段二）=====
  # 镜像由各服务下的 Dockerfile 多阶段构建（context 设为仓库根，自带 maven 打包）。
  # 注意：服务内 application.yml 把依赖地址写成 localhost（便于本机直跑），
  #       容器内需指向 compose 服务名，这里用环境变量按 Spring 宽松绑定规则覆盖，不改 yml。
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    image: concurrency-demo/product-service:1.0
    container_name: concurrency-demo-product
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848        # 覆盖 spring.cloud.nacos.discovery.server-addr
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/concurrency_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_RABBITMQ_HOST: rabbitmq                               # 覆盖 spring.rabbitmq.host
      SEATA_SERVICE_GROUPLIST_DEFAULT: seata:8091                  # 覆盖 seata.service.grouplist.default（file 模式直连 TC）
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seata:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: concurrency-demo/order-service:1.0
    container_name: concurrency-demo-order
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/concurrency_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_RABBITMQ_HOST: rabbitmq
      SEATA_SERVICE_GROUPLIST_DEFAULT: seata:8091
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seata:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    image: concurrency-demo/gateway-service:1.0
    container_name: concurrency-demo-gateway
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    ports:
      - "8090:8090"             # 直连网关便于调试（生产入口走 nginx 80）
    depends_on:
      nacos:
        condition: service_healthy
      product-service:
        condition: service_started
      order-service:
        condition: service_started

  # ===== Nginx 统一入口 =====
  # 监听宿主机 80，反向代理到 gateway-service:8090；gateway 再按 serviceId 路由到下游微服务。
  nginx:
    image: nginx:alpine
    container_name: concurrency-demo-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-service

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
